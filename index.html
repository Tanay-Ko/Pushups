<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PUSHUPS" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>PUSHUPS</title>
  </head>
  <body>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red;font-size:12px;padding:20px;z-index:99999;position:absolute;background:black;top:0;left:0;width:100%;height:100%;overflow:auto;"><b>Runtime Error:</b><br>' + message + '<br><br>' + (error && error.stack) + '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red;font-size:12px;padding:20px;z-index:99999;position:absolute;background:black;top:0;left:0;width:100%;height:100%;overflow:auto;"><b>Unhandled Promise:</b><br>' + event.reason + '</div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
